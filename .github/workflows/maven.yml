name: Java CI with Maven and SonarQube

on:
  push:
    branches: [ main, master, 'branch#1' ]
  pull_request:
    branches: [ main, master, 'branch#1' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -Djava.awt.headless=true

      - name: Run SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=TaskSeven \
            -Dsonar.host.url=https://dignified-hingeless-ehtel.ngrok-free.dev \
            -Dsonar.login=sqa_2a03975856e995f0f5738bd769b39a7198841781
